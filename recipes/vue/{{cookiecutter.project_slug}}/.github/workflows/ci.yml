name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run knip
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build and check the static SPA
        run: |
          trap 'docker compose down --volumes --remove-orphans --rmi local' EXIT
          docker compose up --build --detach --wait
          test "$(docker compose exec -T frontend id -u)" != 0
          curl --fail http://127.0.0.1:8080/ | grep 'id="app"'
          curl --fail http://127.0.0.1:8080/client/side/route | grep 'id="app"'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/assets/missing.js)" = 404
