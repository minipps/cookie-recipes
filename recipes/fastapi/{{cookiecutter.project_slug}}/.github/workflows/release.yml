{% raw %}name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  image:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
{% endraw %}{% if cookiecutter._frontend %}    strategy:
      matrix:
        include:
          - dockerfile: docker/Dockerfile
            suffix: ""
          - dockerfile: docker/frontend.Dockerfile
            suffix: "-frontend"
{% endif %}{% raw %}    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.21"
          python-version: "3.13"
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          import pathlib
          import tomllib

          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit(f"Release tag must match pyproject.toml: v{version}")
          PY
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
{% endraw %}{% if cookiecutter._frontend %}{% raw %}          images: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
{% endraw %}{% else %}{% raw %}          images: ghcr.io/${{ github.repository }}
{% endraw %}{% endif %}{% raw %}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
{% endraw %}{% if cookiecutter._frontend %}{% raw %}          file: ${{ matrix.dockerfile }}
{% endraw %}{% else %}          file: docker/Dockerfile
{% endif %}{% raw %}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
{% endraw %}{% if cookiecutter._frontend %}{% raw %}          cache-from: type=gha,scope=api${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=api${{ matrix.suffix }}
{% endraw %}{% else %}          cache-from: type=gha
          cache-to: type=gha,mode=max
{% endif %}{% raw %}
{% endraw %}
