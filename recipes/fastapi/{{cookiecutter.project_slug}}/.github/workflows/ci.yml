{% raw %}name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
{% endraw %}{% if cookiecutter.database == 'postgresql' %}    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:test-password@localhost:5432/test
      TEST_DATABASE_URL: postgres://app:test-password@localhost:5432/test
{% endif %}{% raw %}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Format
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Types
        run: uv run --locked ty check
      - name: Architecture
        run: uv run --locked lint-imports
      - name: Tests
        run: uv run --locked python -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.19"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - name: Build image and verify database persistence
        env:
          RUN_DOCKER_TESTS: "1"
        run: uv run --locked python -m unittest discover -s tests -p test_docker.py -v
{% endraw %}
