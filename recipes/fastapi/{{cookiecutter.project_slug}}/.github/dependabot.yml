version: 2
updates:
  - package-ecosystem: uv
    directory: "{{ '/backend' if cookiecutter._frontend else '/' }}"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # First match wins; the remaining Python packages belong to the runtime group.
      python-development:
        patterns: ["ruff", "ty", "import-linter", "uv-build", "uv_build"]
      python-runtime:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]

{% if cookiecutter.database == 'postgresql' %}  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    groups:
      database-images:
        patterns: ["*"]

{% endif %}{% if cookiecutter._frontend %}  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-development:
        dependency-type: development
    ignore:
      # TODO: allow TypeScript 7 once vue-tsc supports it.
      - dependency-name: typescript
        versions: [">=7"]

{% endif %}  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
