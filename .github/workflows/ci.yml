name: Recipe CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recipes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: "recipes/fastapi-vue/{{cookiecutter.project_slug}}/frontend/.node-version"
          cache: npm
          cache-dependency-path: "recipes/fastapi-vue/{{cookiecutter.project_slug}}/frontend/package-lock.json"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "recipes/**/pyproject.toml"
      - name: Recipe test formatting and lint
        run: |
          uvx ruff check --isolated --target-version py313 tests
          uvx ruff format --isolated --check --line-length 100 tests
      - name: FastAPI and Vue recipe gates and Docker persistence for both databases
        env:
          RUN_DOCKER_TESTS: "1"
        run: uv run --no-project --with cookiecutter python -m unittest discover -s tests -v
